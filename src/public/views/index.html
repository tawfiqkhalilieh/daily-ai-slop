<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Blog</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <center>
    <header class="site-header">
      <div class="header-container">
        <a href="#" class="logo">Daily AI Blog</a>
        <nav>
          <ul class="nav-menu">
            <li><a href="#" class="active">Articles</a></li>
            <li><a href="https://taw.vercel.app">About Me</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="hero-section">
      <div class="hero-content">
        <h1 class="hero-title">Latest Articles</h1>
        <p class="hero-description">
          Explore our collection of articles on web development, design, and technology trends.

          Note: All articles are generated by AI for expiremntal purposes.

        </p>
      </div>
    </section>

    <section class="articles-section">
      <div class="section-header">
        <h2 class="section-title">All Articles</h2>
        <p class="section-subtitle">Browse through our latest content</p>
      </div>

      <div class="search-container">
        <div class="search-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <path
              d="M17.5 17.5L13.875 13.875M15.8333 9.16667C15.8333 12.8486 12.8486 15.8333 9.16667 15.8333C5.48477 15.8333 2.5 12.8486 2.5 9.16667C2.5 5.48477 5.48477 2.5 9.16667 2.5C12.8486 2.5 15.8333 5.48477 15.8333 9.16667Z"
              stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search articles by title...">
        </div>
        <div class="search-results-info" id="searchResultsInfo"></div>
      </div>

      <div class="articles-grid">
      </div>
    </section>
  </center>
  <script>
    const searchInput = document.getElementById('searchInput');
    const searchResultsInfo = document.getElementById('searchResultsInfo');
    const articleCards = document.querySelectorAll('.article-card');
    const totalArticles = articleCards.length;

    searchInput.addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase().trim();
      let visibleCount = 0;

      articleCards.forEach(card => {
        const title = card.querySelector('.article-card-title').textContent.toLowerCase();

        if (title.includes(searchTerm)) {
          card.style.display = 'block';
          visibleCount++;
        } else {
          card.style.display = 'none';
        }
      });

      if (searchTerm === '') {
        searchResultsInfo.textContent = '';
      } else if (visibleCount === 0) {
        searchResultsInfo.textContent = 'No articles found matching your search.';
      } else if (visibleCount === totalArticles) {
        searchResultsInfo.textContent = `Showing all ${totalArticles} articles`;
      } else {
        searchResultsInfo.textContent = `Found ${visibleCount} article${visibleCount !== 1 ? 's' : ''}`;
      }
    });

    const articles = fetch('articles/').then(res => res.json()).then(data => {
      const container = document.querySelector('.articles-grid');
      data.forEach(article => {
        const articleCard = document.createElement('a');
        articleCard.href = `/article/${article.id}`;
        articleCard.className = 'article-card';
        articleCard.innerHTML = `
          <h3 class="article-card-title">${article.title}</h3>
          <p class="article-card-excerpt">${article.excerpt}</p>
          <div class="article-card-footer">
            <div class="article-author">
              <div class="author-avatar">AI</div>
              <span class="author-name">Star Flank [AI]</span>
            </div>
            <span class="read-time">${article.read_time} min read</span>
          </div>
        `;
        container.appendChild(articleCard);
      });
    });
  </script>
</body>

</html>
