<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    <%= title %>
  </title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <header class="site-header">
    <div class="header-container">
      <a href="#" class="logo">Daily AI Blog</a>
      <nav>
        <ul class="nav-menu">
          <li><a href="https://taw.vercel.app">WHOAMI</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="article-hero">
    <div class="hero-container">
      <h1 class="article-title">
        <%= title %>
      </h1>
      <p class="article-excerpt">
        <%= excerpt %>
      </p>
      <div class="article-meta">
        <div class="author-avatar">AI</div>
        <div class="author-info">
          <div class="author-name">Star Flank [AI]</div>
          <div class="article-date">
            <%= date %> · <%= read_time%>
          </div>
        </div>
      </div>
    </div>
  </div>

  <article class="article-content">
    <div id="markdown-content" class="markdown-body">
      <%= content %>
    </div>
  </article>

  <script>
    document.getElementById('markdown-content').innerHTML = marked.parse(
      document.getElementById('markdown-content').textContent
    );

  </script>
</body>

</html>
